name: Windows build (HLE surround)

on:
  push:
    branches: [hle-surround]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ninja-release-x64

      - name: Build
        run: cmake --build --preset ninja-build-release-x64

      - name: Package
        shell: pwsh
        run: |
          $out = "build\release\x64\Binaries"
          Get-ChildItem $out -Recurse -Include *.pdb,*.exp,*.lib,*.ilk | Remove-Item -ErrorAction SilentlyContinue
          New-Item -ItemType File "$out\portable.txt" -Force | Out-Null
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: Dolphin-HLE-Surround-win-x64
          path: build/release/x64/Binaries/
